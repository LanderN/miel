name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - name: Validate release tag
        id: version
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re

          tag = os.environ['RELEASE_TAG']
          match = re.fullmatch(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', tag)
          if match is None or (
              os.environ['RELEASE_EVENT'] != 'workflow_dispatch'
              and os.environ['RELEASE_REF_TYPE'] != 'tag'
          ):
              raise SystemExit('Select a release tag named vMAJOR.MINOR.PATCH.')
          major, minor, patch = map(int, match.groups())
          code = major * 1_000_000 + minor * 1_000 + patch
          if minor > 999 or patch > 999 or not 0 < code <= 2_100_000_000:
              raise SystemExit('Tag exceeds Android versionCode limits (minor and patch must be <= 999).')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'MIEL_VERSION_NAME={tag[1:]}\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag={tag}\n')
          PY

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.version.outputs.tag }}
          lfs: true
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          log-accepted-android-sdk-licenses: false

      - name: Prepare Android build tools
        run: |
          # Free space on the disposable runner for the native source builds and SDKs.
          sudo rm -rf /usr/share/dotnet "$ANDROID_HOME/emulator" "$ANDROID_HOME/system-images"
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config nasm
          python3 - <<'PY' > "$RUNNER_TEMP/miel-sdk-packages.txt"
          import glob
          import json

          packages = {'platforms;android-37.0', 'build-tools;36.0.0', 'ndk;27.2.12479018'}
          for path in glob.glob('third_party/*/manifest.json'):
              with open(path) as source:
                  manifest = json.load(source)
              packages.add(f"ndk;{manifest['android_ndk']}")
              if 'android_cmake' in manifest:
                  packages.add(f"cmake;{manifest['android_cmake']}")
          print('\n'.join(sorted(packages)))
          PY
          sdkmanager --package_file="$RUNNER_TEMP/miel-sdk-packages.txt"
          df -h .

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build.sh', 'third_party/**/manifest.json', 'third_party/**/*.patch') }}

      - name: Build signed release
        env:
          MIEL_SIGNING_KEYSTORE_BASE64: ${{ secrets.MIEL_SIGNING_KEYSTORE_BASE64 }}
          MIEL_SIGNING_STORE_PASSWORD: ${{ secrets.MIEL_SIGNING_STORE_PASSWORD }}
          MIEL_SIGNING_KEY_ALIAS: ${{ secrets.MIEL_SIGNING_KEY_ALIAS }}
          MIEL_SIGNING_KEY_PASSWORD: ${{ secrets.MIEL_SIGNING_KEY_PASSWORD }}
        run: |
          umask 077
          export MIEL_SIGNING_STORE_FILE="$RUNNER_TEMP/miel-release.jks"
          trap 'rm -f "$MIEL_SIGNING_STORE_FILE"' EXIT
          test -n "$MIEL_SIGNING_KEYSTORE_BASE64"
          printf '%s' "$MIEL_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$MIEL_SIGNING_STORE_FILE"
          unset MIEL_SIGNING_KEYSTORE_BASE64
          scripts/build.sh release arm64-v8a
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose android/app/build/outputs/apk/release/app-release.apk
          mkdir -p artifacts/release
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/release/miel-arm64-v8a.apk
          (cd artifacts/release && sha256sum miel-arm64-v8a.apk > miel-arm64-v8a.apk.sha256)
          (cd artifacts/release && sha256sum miel-arm64-v8a.apk miel-source.tar.gz > SHA256SUMS)

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/miel-release.jks"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-release
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-release
          path: release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          cd release
          sha256sum --check SHA256SUMS
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > "$RUNNER_TEMP/miel-release-draft"; then
            if [ "$(cat "$RUNNER_TEMP/miel-release-draft")" != true ]; then
              echo 'This release is already published; choose a new version instead of replacing its APK.' >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "miel $RELEASE_TAG" \
              --notes 'Download miel-arm64-v8a.apk to install. Corresponding source, core dependencies, build scripts and patches are in miel-source.tar.gz. Third-party components retain their individual licenses. Checksums are in SHA256SUMS.'
          fi
          gh release upload "$RELEASE_TAG" miel-arm64-v8a.apk miel-arm64-v8a.apk.sha256 miel-source.tar.gz SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
